name: Python Tests

# Визначаємо тригери: коли запускати воркфлоу
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    # Використовуємо останню версію Ubuntu
    runs-on: ubuntu-latest

    steps:
    - name: Перевірка коду (Checkout)
      uses: actions/checkout@v4

    - name: Встановлення Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Встановлення залежностей
      run: |
        python -m pip install --upgrade pip
        pip install pygame  # Оскільки змійка використовує pygame
        # Якщо у вас є requirements.txt, розкоментуйте рядок нижче:
        # pip install -r requirements.txt

    - name: Запуск тестів
      run: |
        # Запускаємо всі файли, що починаються на test_
        python -m unittest discover -p 'test_*.py'